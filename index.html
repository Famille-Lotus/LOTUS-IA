<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMÉA IA.</title>
<link rel="apple-touch-icon" href="F9047018-B6CB-4DE2-B73C-9E189C3AA03E.png">
<style>
body { margin:0; min-height:100vh; background:#fff8ec; color:#a67c2d; font-family:Arial,sans-serif; text-align:center; }
main { padding:80px 20px; }
h1 { font-size:28px; }
p { color:#806a48; }
</style>
</head>
<body>
<main>
<h1>✨ LUMÉA IA.</h1>
<p>Votre intelligence artificielle douce et intuitive.</p>

<section style="max-width:500px;margin:40px auto;padding:22px;background:#fffaf0;border:1px solid #d4af70;border-radius:20px;text-align:left;">
  <h2 style="color:#a47c35;">💬 Discuter avec LUMÉA</h2>
  <div id="conversation" style="min-height:100px;color:#806a48;">
    Bonjour ! Je suis LUMÉA. 💛
  </div>
  <input id="message" placeholder="Écrivez votre message..."
    style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #d4af70;border-radius:12px;">
  <button onclick="envoyer()" style="margin-top:12px;padding:12px 24px;background:#b48b42;color:white;border:0;border-radius:12px;">
    Envoyer ✨
  </button>
<button type="button" onclick="ecouterLumea()">🔊 Écouter LUMÉA</button>
</section>
<script>
function ecouterLumea() {
  const messages = document.querySelectorAll("#conversation p");
  const dernier = messages[messages.length - 1];
  const texte = dernier ? dernier.textContent : "Bonjour ! Je suis LUMÉA.";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const voix = new SpeechSynthesisUtterance(texte);
  voix.lang = "fr-FR";

const voixDisponibles = window.speechSynthesis.getVoices();

const voixFeminine =
  voixDisponibles.find(v =>
    v.lang.toLowerCase().startsWith("fr") &&
    /hortense|denise|amelie|amélie|audrey|marie|siri/i.test(v.name)
  );



if (voixFeminine) {
  voix.voice = voixFeminine;
}




  


voix.rate = 0.85;
voix.pitch = 1.0;

window.speechSynthesis.speak(voix);

  } else {
    alert("La lecture vocale n'est pas disponible.");
  }
}
function envoyer() {
  const champ = document.getElementById("message");
  const texte = champ.value.trim();
  if (!texte) return;

  const conversation = document.getElementById("conversation");
  const p = document.createElement("p");
  p.textContent = "Vous : " + texte;
  conversation.appendChild(p);
  champ.value = "";

  const reponse = document.createElement("p");
  reponse.textContent = "LUMÉA 💛 : " + (
    /bonjour|salut/i.test(texte) ? "Bonjour ! 💛 Comment allez-vous ?" :
    /comment vas|et vous|et toi|je vais bien|bien merci/i.test(texte) ? "Je vais très bien, merci ! 💛 Que souhaitez-vous faire aujourd'hui ?" :
    /où es|ou es/i.test(texte) ? "Je suis une assistante virtuelle. 💛" :
    /ton nom|tu t.appelles/i.test(texte) ? "Je m'appelle LUMÉA IA. ✨" :
    /merci/i.test(texte) ? "Avec plaisir ! 💛" :
    "Je suis LUMÉA 💛. Peux-tu préciser ta question ?"
  );
  conversation.appendChild(reponse);
}




</script>
<p>💛 Bienvenue dans votre nouvel univers.</p>
<footer style="text-align:center;color:#a47c35;padding:25px;font-size:14px;">© 2026 LUMÉA IA — Tous droits réservés.</footer>
</body>
</html>

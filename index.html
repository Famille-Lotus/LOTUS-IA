<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMÉA IA.</title>
<style>
body { margin:0; min-height:100vh; background:#fff8ec; color:#a67c2d; font-family:Arial,sans-serif; text-align:center; }
main { padding:80px 20px; }
h1 { font-size:42px; }
p { color:#806a48; }
</style>
</head>
<body>
<main>
<h1>✨ LUMÉA IA.</h1>
<p>Votre intelligence artificielle douce et intuitive.</p>

<section style="max-width:500px;margin:40px auto;padding:22px;background:#fffaf0;border:1px solid #d4af70;border-radius:20px;text-align:left;">
  <h2 style="color:#a47c35;">💬 Discuter avec LUMÉA</h2>
  <div id="conversation" style="min-height:100px;color:#806a48;">
    Bonjour ! Je suis LUMÉA. 💛
  </div>
  <input id="message" placeholder="Écrivez votre message..."
    style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #d4af70;border-radius:12px;">
  <button onclick="envoyer()" style="margin-top:12px;padding:12px 24px;background:#b48b42;color:white;border:0;border-radius:12px;">
    Envoyer ✨
  </button>
</section>
<script>
function envoyer() {
  const champ = document.getElementById("message");
  const texte = champ.value.trim();
  if (!texte) return;
  const conversation = document.getElementById("conversation");
  const p = document.createElement("p");
  p.textContent = "Vous : " + texte;
  conversation.appendChild(p);
  champ.value = "";
}
</script>
<p>💛 Bienvenue dans votre nouvel univers.</p>
</main>
</body>
</html>

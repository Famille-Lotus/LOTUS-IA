<script>
let lumeaChanson = null;

async function lumeaEcouter() {
  const statut = document.getElementById("musiqueStatut");

  if (!navigator.mediaDevices?.getUserMedia ||
      !window.MediaRecorder) {
    statut.textContent =
      "Enregistrement non disponible sur ce navigateur.";
    return;
  }

  let flux;

  try {
    statut.textContent = "🎤 Autorisation du microphone...";

    flux = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    const morceaux = [];
    const enregistreur = new MediaRecorder(flux);

    enregistreur.ondataavailable = event => {
      if (event.data.size) morceaux.push(event.data);
    };

    enregistreur.onerror = () => {
      statut.textContent = "Erreur d'enregistrement.";
      flux.getTracks().forEach(t => t.stop());
    };

    enregistreur.onstop = () => {
      flux.getTracks().forEach(t => t.stop());

      const audio = new Blob(morceaux, {
        type: enregistreur.mimeType
      });

      statut.textContent =
        "✅ Extrait de " +
        Math.round(audio.size / 1024) +
        " Ko enregistré. Le moteur de reconnaissance doit encore être connecté.";
    };

    enregistreur.start();
    statut.textContent = "🎶 LUMÉA écoute pendant 8 secondes...";

    setTimeout(() => {
      if (enregistreur.state === "recording") {
        enregistreur.stop();
      }
    }, 8000);

  } catch (erreur) {
    if (flux) flux.getTracks().forEach(t => t.stop());
    statut.textContent =
      "❌ Microphone refusé ou indisponible.";
  }
}

function lumeaParoles() {
  if (!lumeaChanson) return;
  alert("Service de paroles à connecter.");
}

function lumeaClip() {
  if (!lumeaChanson) return;
  alert("Service de clips officiels à connecter.");
}
function lumeaApple() {
  if (!lumeaChanson) return;
  window.open(
    "https://music.apple.com/",
    "_blank",
    "noopener,noreferrer"
  );

<script>
function lumeaCarteRecherche() {
  const pays = document.getElementById("mapPays").value.trim();
  const ville = document.getElementById("mapVille").value.trim();
  const service = document.getElementById("mapService").value;

  if (!pays && !ville) {
    document.getElementById("mapStatut").textContent =
      "Indiquez un pays ou une ville.";
    return;
  }

  const recherche = [service, ville, pays].filter(Boolean).join(" ");
  lumeaAfficherCarte(recherche);
}

function lumeaAfficherCarte(recherche) {
  const url = "https://www.google.com/maps?q=" +
    encodeURIComponent(recherche) + "&output=embed";

  document.getElementById("mapFrame").src = url;
  document.getElementById("mapStatut").textContent =
    "🗺️ Carte chargée. Vérifiez les résultats.";
}

function lumeaCarteGPS() {
  const statut = document.getElementById("mapStatut");

  if (!navigator.geolocation) {
    statut.textContent = "Géolocalisation indisponible.";
    return;
  }

  statut.textContent = "📍 Localisation en cours...";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const service = document.getElementById("mapService").value;

      lumeaAfficherCarte(service + " près de " + lat + "," + lon);
    },
    () => {
      statut.textContent = "Position indisponible. Indiquez une ville.";
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}
</script>

const photoInput = document.getElementById("photo");

let imageOriginale = null;

photoInput.addEventListener("change", function() {
  const fichier = this.files[0];
  if (!fichier) return;

  const url = URL.createObjectURL(fichier);
  const image = new Image();

  image.onload = function() {
    imageOriginale = image;

    const taille = Math.min(1, 1600 / Math.max(image.width, image.height));
    photoCanvas.width = Math.round(image.width * taille);
    photoCanvas.height = Math.round(image.height * taille);

    luminosite.value = 100;
 contrastePhoto.value = 100;

    afficherPhoto();
    URL.revokeObjectURL(url);
  };

  image.src = url;
});

contextePhoto.filter = `brightness(${luminosite.value}%) contrast(${contrastePhoto.value}%)`;

function chercherService(type) {
  const statut =
    document.getElementById("serviceStatut");

  if (!navigator.geolocation) {
    statut.textContent =
      "La localisation n'est pas disponible.";
    return;
  }

  statut.textContent =
    "Recherche de votre position...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const recherche = encodeURIComponent(type);

      const url =
        "https://www.google.com/maps/search/" +
        recherche + "/@" +
        lat + "," + lon + ",14z";

      statut.textContent =
        "Ouverture des résultats à proximité...";

      window.location.href = url;
    },
    function() {
      statut.textContent =
        "Localisation indisponible. " +
        "Vérifiez les autorisations Safari.";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000
    }
  );
}
